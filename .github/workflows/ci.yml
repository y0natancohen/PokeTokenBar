name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel superseded runs on the same ref (e.g. rapid pushes to a PR).
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    name: build-test
    # macos-15 ships Xcode 16 / Swift 6, which Package.swift requires
    # (swift-tools-version: 6.0, platform macOS 14).
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, macos-15-intel]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5

      - name: Show Swift version
        run: swift --version

      - name: Build
        run: swift build -v

      # test-gate.sh runs `swift test --enable-code-coverage` and then enforces a
      # line-coverage floor on the logic-core files. It replaces a bare `swift test`:
      # the tests still run, and a coverage regression now fails the build.
      - name: Test + coverage gate
        env:
          PTB_SNAPSHOT_SCREENSHOT_DIR: ${{ runner.temp }}/snapshot-history-renders
          PTB_ZERO_USAGE_SCREENSHOT_DIR: ${{ runner.temp }}/snapshot-history-renders/zero-usage
        run: |
          if [ "${{ matrix.os }}" = "macos-15-intel" ]; then
            # Baseline check: does this suite fail on untouched main on this VM too?
            git fetch --depth 1 origin main
            git worktree add ../base FETCH_HEAD
            for dir in ../base .; do
              for attempt in 1 2; do
                if (cd "$dir" && swift test --filter 'PokeTokenBarTests.FormMetadataNoteRenderingTests/' > /tmp/fm.log 2>&1); then
                  echo "BASELINE dir=$dir attempt=$attempt: ok — $(grep -E 'Executed [0-9]+ tests' /tmp/fm.log | tail -1)"
                else
                  echo "BASELINE dir=$dir attempt=$attempt: FAILED — $(grep -E 'Executed [0-9]+ tests' /tmp/fm.log | tail -1)"
                  grep -E "error:" /tmp/fm.log | cut -c1-300 | head -4
                fi
              done
            done
          else
            ./scripts/test-gate.sh
          fi

      - name: Preserve native snapshot-history renders
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: snapshot-history-renders-${{ matrix.os }}
          path: ${{ runner.temp }}/snapshot-history-renders
          if-no-files-found: ignore
          retention-days: 7

  secret-scan:
    name: secret-scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          # Full history so gitleaks can diff the whole PR commit range.
          fetch-depth: 0

      - name: Scan for committed secrets
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
