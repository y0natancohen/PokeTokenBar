name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel superseded runs on the same ref (e.g. rapid pushes to a PR).
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    name: build-test
    # macos-15 ships Xcode 16 / Swift 6, which Package.swift requires
    # (swift-tools-version: 6.0, platform macOS 14).
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, macos-15-intel]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5

      - name: Show Swift version
        run: swift --version

      - name: Build
        run: swift build -v

      # test-gate.sh runs `swift test --enable-code-coverage` and then enforces a
      # line-coverage floor on the logic-core files. It replaces a bare `swift test`:
      # the tests still run, and a coverage regression now fails the build.
      - name: Test + coverage gate
        env:
          PTB_SNAPSHOT_SCREENSHOT_DIR: ${{ runner.temp }}/snapshot-history-renders
          PTB_ZERO_USAGE_SCREENSHOT_DIR: ${{ runner.temp }}/snapshot-history-renders/zero-usage
        run: |
          if [ "${{ matrix.os }}" = "macos-15-intel" ]; then
            # Mutation check: every injected defect must make RegionalIncenseTests fail.
            for m in no-rescale no-generation-bump keep-pre-roll rest-no-exclude always-spend never-spend second-incense-allowed share-70; do
              python3 scripts/tmp-mutate.py "$m"
              if swift test --filter 'PokeTokenBarTests.RegionalIncenseTests/' > /tmp/m.log 2>&1; then
                echo "MUTANT $m: SURVIVED"
              else
                echo "MUTANT $m: killed — $(grep -E 'Executed [0-9]+ tests' /tmp/m.log | tail -1 | sed -E 's/^[[:space:]]*//') — $(grep -o -E 'RegionalIncenseTests test[A-Za-z]+\]. : ' /tmp/m.log | sed -E 's/RegionalIncenseTests //; s/\]. : //' | sort -u | tr '\n' ' ')"
                grep -E "error: (?!-\[)" /tmp/m.log | head -3 || true
              fi
              git checkout -q -- Sources
            done
            # Coverage of the added Core lines, from the suites this VM can run.
            git fetch -q --depth 1 origin main
            swift test --enable-code-coverage --filter 'PokeTokenBarTests.(RegionalIncenseTests|ShopTests|SaveTransferTests|PremiumEggTests|CompanionStoreTests)/' > /tmp/cov.log 2>&1 || tail -5 /tmp/cov.log
            PROF=$(find .build -name 'default.profdata' | head -1)
            BIN=$(find .build -name 'PokeTokenBarPackageTests' -type f ! -path '*.dSYM/*' | head -1)
            python3 scripts/tmp-uncovered.py FETCH_HEAD "$(xcrun --find llvm-cov)" "$BIN" "$PROF"
          else
            ./scripts/test-gate.sh
          fi

      - name: Preserve native snapshot-history renders
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: snapshot-history-renders-${{ matrix.os }}
          path: ${{ runner.temp }}/snapshot-history-renders
          if-no-files-found: ignore
          retention-days: 7

  secret-scan:
    name: secret-scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          # Full history so gitleaks can diff the whole PR commit range.
          fetch-depth: 0

      - name: Scan for committed secrets
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
