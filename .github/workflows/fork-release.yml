# Fork-only workflow: builds the branch that is installed on the fork owner's Mac.
# Not meant for upstream. It tests, builds, signs and publishes a fork release, then
# points Casks/poke-token-bar.rb at it, so `brew upgrade --cask poke-token-bar`
# (also what the app's own Update button runs) installs this build.
name: Fork release

on:
  push:
    branches: [installed]
    paths-ignore: ["Casks/**"]
  workflow_dispatch:

concurrency:
  group: fork-release
  cancel-in-progress: false

permissions:
  contents: write

env:
  PTB_SIGN_NAME: PokeTokenBar Fork

jobs:
  release:
    name: test-build-release
    if: github.repository == 'y0natancohen/PokeTokenBar'
    runs-on: macos-15
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v5

      - name: Show Swift version
        run: swift --version

      # Same gate as upstream CI. One retry: the OCR-based
      # DexBackNavigationTests render test is flaky on hosted runners.
      - name: Test + coverage gate
        run: ./scripts/test-gate.sh || { echo "::warning::test gate failed once, retrying"; ./scripts/test-gate.sh; }

      - name: Import signing certificate
        env:
          P12_BASE64: ${{ secrets.PTB_SIGN_P12 }}
          P12_PASSWORD: ${{ secrets.PTB_SIGN_P12_PASSWORD }}
        run: |
          set -euo pipefail
          KC="$RUNNER_TEMP/signing.keychain-db"
          KC_PW=$(uuidgen)
          printf '%s' "$P12_BASE64" | base64 --decode > "$RUNNER_TEMP/sign.p12"
          security create-keychain -p "$KC_PW" "$KC"
          security set-keychain-settings -lut 7200 "$KC"
          security unlock-keychain -p "$KC_PW" "$KC"
          security import "$RUNNER_TEMP/sign.p12" -k "$KC" -P "$P12_PASSWORD" -T /usr/bin/codesign
          rm -f "$RUNNER_TEMP/sign.p12"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KC_PW" "$KC" >/dev/null
          SEARCH=("$KC")
          while IFS= read -r k; do k=${k//\"/}; k=${k#"${k%%[![:space:]]*}"}; [ -n "$k" ] && SEARCH+=("$k"); done < <(security list-keychains -d user)
          security list-keychains -d user -s "${SEARCH[@]}"
          # A self-signed certificate is a valid code-signing identity only once it is
          # trusted; build-app.sh looks it up with `security find-identity -v`.
          security find-certificate -c "$PTB_SIGN_NAME" -p "$KC" > "$RUNNER_TEMP/sign-cert.pem"
          sudo security authorizationdb write com.apple.trust-settings.admin allow
          sudo security add-trusted-cert -d -r trustRoot -p codeSign -k /Library/Keychains/System.keychain "$RUNNER_TEMP/sign-cert.pem"
          security find-identity -v -p codesigning | grep -F "\"$PTB_SIGN_NAME\""

      # Upstream's own build script: universal binary, Info.plist, signing.
      # PTB_REQUIRE_STABLE_SIGN makes it fail instead of falling back to ad-hoc.
      - name: Build app
        env:
          CODESIGN_IDENTITY: ${{ env.PTB_SIGN_NAME }}
          PTB_REQUIRE_STABLE_SIGN: "1"
        run: ./scripts/build-app.sh

      - name: Check and package
        id: pkg
        env:
          EXPECTED_LEAF: ${{ vars.PTB_SIGN_LEAF }}
        run: |
          set -euo pipefail
          APP=build/PokeTokenBar.app
          VERSION=$(sed -n 's/^VERSION="\(.*\)"$/\1/p' scripts/build-app.sh)
          PLIST_VERSION=$(/usr/libexec/PlistBuddy -c "Print :CFBundleShortVersionString" "$APP/Contents/Info.plist")
          [ -n "$VERSION" ] && [ "$VERSION" = "$PLIST_VERSION" ]
          ARCHS=$(lipo -archs "$APP/Contents/MacOS/PokeTokenBar")
          case "$ARCHS" in *arm64*x86_64*|*x86_64*arm64*) ;; *) echo "not universal: $ARCHS"; exit 1 ;; esac
          codesign --verify --deep --strict "$APP"
          LEAF=$(codesign -dr - "$APP" 2>&1 | sed -n 's/.*certificate leaf = H"\([0-9a-fA-F]*\)".*/\1/p' | tr 'A-F' 'a-f')
          EXPECTED=$(printf '%s' "$EXPECTED_LEAF" | tr 'A-F' 'a-f')
          if [ -z "$LEAF" ] || [ "$LEAF" != "$EXPECTED" ]; then
            echo "signature leaf '$LEAF' is not the fork certificate '$EXPECTED'"; exit 1
          fi
          ditto -c -k --keepParent "$APP" PokeTokenBar.zip
          BUILD="${GITHUB_RUN_NUMBER}.${GITHUB_RUN_ATTEMPT}"
          {
            echo "version=$VERSION"
            echo "build=$BUILD"
            echo "tag=fork-v$VERSION-$BUILD"
            echo "sha256=$(shasum -a 256 PokeTokenBar.zip | cut -d' ' -f1)"
          } >> "$GITHUB_OUTPUT"

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.pkg.outputs.tag }}
          VERSION: ${{ steps.pkg.outputs.version }}
          BUILD: ${{ steps.pkg.outputs.build }}
        run: |
          gh release create "$TAG" PokeTokenBar.zip \
            --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title "PokeTokenBar $VERSION (fork build $BUILD)" \
            --notes "Fork build of upstream $VERSION plus fork changes, from $GITHUB_SHA. Installed with the Homebrew cask in Casks/poke-token-bar.rb."

      # Commits made with GITHUB_TOKEN do not start workflows, so this cannot loop.
      - name: Point the cask at the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.pkg.outputs.tag }}
          VERSION: ${{ steps.pkg.outputs.version }}
          BUILD: ${{ steps.pkg.outputs.build }}
          SHA256: ${{ steps.pkg.outputs.sha256 }}
        run: |
          set -euo pipefail
          CASK=Casks/poke-token-bar.rb
          API="repos/$GITHUB_REPOSITORY/contents/$CASK"
          gh api "$API?ref=installed" --jq .content | base64 --decode > "$RUNNER_TEMP/cask.rb"
          sed -i '' \
            -e "s/^  version \".*\"$/  version \"$VERSION,$BUILD\"/" \
            -e "s/^  sha256 \".*\"$/  sha256 \"$SHA256\"/" \
            "$RUNNER_TEMP/cask.rb"
          grep -qF "version \"$VERSION,$BUILD\"" "$RUNNER_TEMP/cask.rb"
          grep -qF "sha256 \"$SHA256\"" "$RUNNER_TEMP/cask.rb"
          gh api -X PUT "$API" \
            -f message="chore(cask): install fork build $TAG" \
            -f content="$(base64 < "$RUNNER_TEMP/cask.rb")" \
            -f sha="$(gh api "$API?ref=installed" --jq .sha)" \
            -f branch=installed >/dev/null
          echo "cask now at $VERSION,$BUILD"
